name: generate animation

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Xynel0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#39d353&color_dots=#0d1117,#5c0000,#8b0000,#c00000,#ff3333
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39d353&color_dots=#0d1117,#5c0000,#8b0000,#c00000,#ff3333
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
