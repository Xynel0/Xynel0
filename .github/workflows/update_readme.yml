name: Update README.md

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Xynel0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#39d353&color_dots=#161b22,#5c0000,#8b0000,#c00000,#ff3333&color_background=#000000
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39d353&color_dots=#161b22,#5c0000,#8b0000,#c00000,#ff3333&color_background=#000000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README stats cache
        run: |
          VERSION=$(date +%s)

          sed -i "s/&v=[0-9]*/\&v=${VERSION}/g" README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh README stats cache"
            git push
          fi
